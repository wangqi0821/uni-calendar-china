<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uni 日历</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen py-8">
    <div class="max-w-md mx-auto px-4">
        <h1 class="text-5xl font-bold text-center mb-8 text-amber-600 flex items-center justify-center gap-3">
            🐾 Uni 日历
        </h1>

        <div class="bg-white rounded-3xl shadow-lg p-8">
            <div class="mb-6">
                <input id="dateInput" type="date" 
                       class="w-full text-center text-2xl font-medium border border-amber-300 rounded-2xl px-6 py-4 focus:outline-none focus:border-amber-500">
            </div>

            <div id="result" class="min-h-[420px]"></div>
        </div>

        <p class="text-center text-sm text-gray-500 mt-6">
            数据来自 Uni.json • 图片使用 jsDelivr 全球加速
        </p>
    </div>

    <script>
        let dateMap = new Map();

        async function loadData() {
            try {
                const res = await fetch('Uni.json');
                const data = await res.json();
                
                data.forEach(item => {
                    if (item.日期) dateMap.set(item.日期, item);
                });

                const input = document.getElementById('dateInput');
                const latest = [...dateMap.keys()].pop() || new Date().toISOString().slice(0,10);
                input.value = latest;
                input.addEventListener('change', () => showDate(input.value));
                
                showDate(latest);
            } catch (e) {
                document.getElementById('result').innerHTML = `<div class="text-red-500 text-center py-12 text-xl">❌ 加载 Uni.json 失败</div>`;
            }
        }

        function showDate(dateStr) {
            const item = dateMap.get(dateStr);
            const resultDiv = document.getElementById('result');

            if (item && item.Uni) {
                const images = item.Uni.split(',').map(url => url.trim());
                let imgHTML = images.map(url => `
                    <img src="${url}" class="max-w-full rounded-2xl shadow-md mb-4 mx-auto block" alt="Uni">
                `).join('');

                resultDiv.innerHTML = `
                    <div class="text-center">
                        <div class="inline-flex items-center gap-2 bg-amber-100 text-amber-700 px-6 py-2 rounded-3xl text-xl font-medium mb-6">
                            📅 ${dateStr}
                        </div>
                        ${imgHTML}
                        <div class="mt-8 text-left bg-gray-50 p-6 rounded-2xl text-lg leading-relaxed whitespace-pre-wrap">
                            ${item.描述 || '暂无描述'}
                        </div>
                        \( {item.原链接 ? `<a href=" \){item.原链接}" target="_blank" class="mt-6 inline-block text-blue-600 hover:underline">🔗 查看原始 Instagram 帖子</a>` : ''}
                    </div>
                `;
            } else {
                resultDiv.innerHTML = `
                    <div class="bg-yellow-100 border border-yellow-300 text-yellow-800 p-8 rounded-3xl text-center">
                        <p class="text-xl font-medium">${dateStr} 还没有记录</p>
                    </div>
                `;
            }
        }

        window.onload = loadData;
    </script>
</body>
</html>
