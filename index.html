<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>Uni 日历</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen py-8">
    <div class="max-w-3xl mx-auto px-4">
        <h1 class="text-5xl font-bold text-center mb-8 text-amber-600">🐾 Uni 日历</h1>

        <div class="bg-white rounded-3xl shadow-lg p-8">
            <input id="dateInput" type="date" class="w-full text-center text-2xl font-medium border border-amber-300 rounded-2xl px-6 py-4 focus:outline-none focus:border-amber-500 mb-6">

            <div id="result" class="min-h-[400px]"></div>
        </div>

        <p class="text-center text-sm text-gray-500 mt-8">
            日历由Uni粉丝制作，供大家方便检索 Uni 的可爱瞬间，未经主人允许请勿用于其他用途。
        </p >
    </div>

    <script>
        let dateMap = new Map();
        let allDates = [];

        async function loadData() {
            const res = await fetch('Uni.json?' + Date.now());
            const data = await res.json();

            data.forEach(item => {
                if (item.日期) {
                    if (!dateMap.has(item.日期)) dateMap.set(item.日期, []);
                    dateMap.get(item.日期).push(item);
                }
            });

            allDates = Array.from(dateMap.keys()).sort();

            const input = document.getElementById('dateInput');
            input.value = "2020-06-10";
            input.addEventListener('change', () => showDate(input.value));
            showDate("2020-06-10");
        }

        function showDate(selectedDate) {
            const posts = dateMap.get(selectedDate) || [];
            const resultDiv = document.getElementById('result');

            if (posts.length > 0) {
                let html = `<div class="text-center mb-6"><span class="bg-green-100 text-green-700 px-6 py-2 rounded-3xl text-xl">📅 ${selectedDate} 共有 ${posts.length} 条帖子</span></div>`;

                posts.forEach(post => {
                    html += `<div class="mb-10 border-b pb-8 last:border-none">`;
                    html += `<h3 class="text-xl font-medium mb-4">${post.描述 || '暂无描述'}</h3>`;

                    if (post.Uni && Array.isArray(post.Uni)) {
                        html += `<div class="grid grid-cols-1 md:grid-cols-3 gap-4">`;
                        post.Uni.forEach(url => {
                            url = url.trim();
                            if (url.match(/\.(jpg|jpeg|png|gif)$/i)) {
                                html += `< img src="${url}" class="rounded-2xl shadow-md w-full">`;
                            } else if (url.match(/\.(mp4|mov|webm)$/i)) {
                                html += `<video src="${url}" controls class="rounded-2xl shadow-md w-full"></video>`;
                            }
                        });
                        html += `</div>`;
                    }

                    if (post.原链接) {
                        html += `<a href=" " target="_blank" class="mt-4 inline-flex items-center gap-1 text-blue-600 hover:underline">🔗 查看原始 Instagram 帖子</a >`;
                    }
                    html += `</div>`;
                });

                resultDiv.innerHTML = html;
            } else {
                const selected = new Date(selectedDate);
                const future = allDates.filter(d => new Date(d) >= selected);
                const jumpDate = future.length ? future[0] : allDates[allDates.length-1];

                resultDiv.innerHTML = `
                    <div class="bg-yellow-100 border border-yellow-300 text-yellow-800 p-8 rounded-3xl text-center">
                        <p class="text-xl font-medium">${selectedDate} 还没有记录</p >
                        <p class="mt-3">已自动跳转到下一个有记录的日期 <strong>${jumpDate}</strong></p >
                    </div>`;
                
                setTimeout(() => {
                    document.getElementById('dateInput').value = jumpDate;
                    showDate(jumpDate);
                }, 1000);
            }
        }

        window.onload = loadData;
    </script>
</body>
</html>
