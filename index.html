<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uni 日历</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen py-8">
    <div class="max-w-3xl mx-auto px-4">
        <h1 class="text-5xl font-bold text-center mb-8 text-amber-600">🐾 Uni 日历</h1>

        <div class="bg-white rounded-3xl shadow-lg p-8">
            <input id="dateInput" type="date" class="w-full text-center text-2xl font-medium border border-amber-300 rounded-2xl px-6 py-4 mb-6">

            <div id="result" class="min-h-[400px] text-center"></div>
        </div>

        <p class="text-center text-sm text-gray-500 mt-8">
            日历由Uni粉丝制作，供大家方便检索 Uni 的可爱瞬间，未经主人允许请勿用于其他用途。
        </p >
    </div>

    <script>
        let dateMap = new Map();

        async function loadData() {
            try {
                const res = await fetch('Uni.json?' + Date.now());
                const data = await res.json();

                data.forEach(item => {
                    if (item.日期) {
                        if (!dateMap.has(item.日期)) dateMap.set(item.日期, []);
                        dateMap.get(item.日期).push(item);
                    }
                });

                const input = document.getElementById('dateInput');
                input.value = "2020-06-10";
                input.addEventListener('change', () => showDate(input.value));
                showDate("2020-06-10");
            } catch (e) {
                document.getElementById('result').innerHTML = `<div class="text-red-500 py-12">加载失败，请刷新页面</div>`;
            }
        }

        function showDate(date) {
            const posts = dateMap.get(date) || [];
            const div = document.getElementById('result');

            if (posts.length === 0) {
                div.innerHTML = `<p class="text-yellow-600">该日期还没有记录</p >`;
                return;
            }

            let html = `<p class="text-green-700 font-medium mb-6">📅 ${date} 共有 ${posts.length} 条帖子</p >`;

            posts.forEach(post => {
                html += `<div class="mb-8">`;
                html += `<p class="text-lg font-medium">${post.描述 || ''}</p >`;

                if (post.Uni) {
                    const urls = post.Uni.split('\n').filter(u => u.trim());
                    html += `<div class="grid grid-cols-1 md:grid-cols-3 gap-4 mt-4">`;
                    urls.forEach(url => {
                        url = url.trim();
                        if (url) {
                            html += `< img src="${url}" class="rounded-2xl shadow-md w-full">`;
                        }
                    });
                    html += `</div>`;
                }

                if (post.原链接) {
                    html += `<a href=" " target="_blank" class="mt-4 text-blue-600 hover:underline block">🔗 查看原始 Instagram 帖子</a >`;
                }
                html += `</div>`;
            });

            div.innerHTML = html;
        }

        window.onload = loadData;
    </script>
</body>
</html>
